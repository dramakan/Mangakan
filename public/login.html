<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Unlock the Realm ✨ Mangakan</title>
    <meta name="description" content="Sign in or create an account to subscribe to your favorite manga on Mangakan.">
    <meta name="author" content="Karash">
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- PREMIUM & CUTE CSS VARIABLES --- */
        :root {
            --bg-main: #fcfcfd; 
            --bg-card: #ffffff;
            --primary: #ff9a9e; 
            --accent: #a18cd1;  
            --text-dark: #2d3142; 
            --text-muted: #8c92a4;
            --shadow-subtle: 0 12px 30px rgba(161, 140, 209, 0.08);
            --shadow-hover: 0 20px 40px rgba(255, 154, 158, 0.18);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- MAGIC CHARACTER CURSOR --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(rgba(255, 154, 158, 0.05) 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, .logo, nav a, .auth-title, .btn-submit, .btn-google {
            font-family: 'Poppins', sans-serif;
        }

     
        /* --- THE ANIMATING CHARACTER (KUROMI) --- */
        #mascot {
            position: fixed; top: -100px; left: -100px; 
            width: 75px; height: 75px; 
            background: transparent; pointer-events: none; 
            z-index: 9998; display: flex; justify-content: center; align-items: center;
            will-change: transform, left, top;
            animation: breatheCharacter 2s ease-in-out infinite alternate;
        }
        
        #character-sprite {
            width: 100%; height: 100%; object-fit: contain;
            transition: transform 0.3s ease, filter 0.3s ease; 
            filter: drop-shadow(0 8px 15px rgba(255, 154, 158, 0.3));
        }

        #mascot-trail {
            position: absolute; width: 140%; height: 140%;
            display: none; justify-content: center; align-items: center;
            font-size: 32px; animation: trailStars 1s linear infinite;
            z-index: -1;
        }

        /* Mascot States */
        .character-moving #character-sprite { transform: scale(1.02) rotate(5deg); filter: drop-shadow(0 5px 15px rgba(255, 154, 158, 0.4)); }
        .character-interact #character-sprite { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 15px var(--primary)) brightness(1.1); }
        .character-glide #character-sprite { transform: rotate(-15deg) translateY(-8px); filter: drop-shadow(0 0 15px var(--accent)); }
        .character-glide #mascot-trail { display: flex; }

        @media (max-width: 850px) {
            #mascot { display: none; }
            * { cursor: auto !important; /* Restore normal cursor on mobile */ }
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-main); display: flex; justify-content: center; align-items: center; flex-direction: column;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s;
        }
        .magic-orb {
            width: 70px; height: 70px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent)); animation: breatheOrb 2s ease-in-out infinite;
        }
        .loader-text { margin-top: 25px; font-weight: 700; font-size: 16px; letter-spacing: 1.5px; color: var(--text-dark); animation: pulseText 2s infinite; }

        /* --- NAVBAR --- */
        header {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            padding: 18px 5%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid rgba(255, 154, 158, 0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .logo { font-size: 28px; font-weight: 800; background: linear-gradient(45deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; cursor: pointer; }
        nav ul { display: flex; list-style: none; gap: 35px; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 16px; transition: var(--transition); position: relative; }
        nav a:hover { color: var(--text-dark); }
        nav a::after { content: '✨'; position: absolute; font-size: 10px; top: -10px; right: -10px; opacity: 0; transition: var(--transition); transform: scale(0); }
        nav a:hover::after { opacity: 1; transform: scale(1); } 

        /* --- ✨ AUTHENTICATION (LOGIN/SIGNUP) STYLES ✨ --- */
        main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 60px 5%; 
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(161, 140, 209, 0.12);
            border: 2px solid rgba(255, 154, 158, 0.15);
            text-align: center;
            position: relative;
        }

        /* Floating cute icons */
        .auth-card::before {
            content: '🌸'; position: absolute; top: -20px; left: -20px; font-size: 45px; animation: floatHero 4s infinite alternate; filter: drop-shadow(0 5px 10px rgba(255,154,158,0.3));
        }
        .auth-card::after {
            content: '✨'; position: absolute; bottom: -15px; right: -15px; font-size: 35px; animation: floatHero 3s infinite alternate-reverse; filter: drop-shadow(0 5px 10px rgba(161,140,209,0.3));
        }

        .auth-title {
            font-size: 32px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px;
        }
        .auth-title span {
            background: linear-gradient(45deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            font-size: 15px; color: var(--text-muted); font-weight: 600; margin-bottom: 30px;
        }

        /* Google Login Button */
        .btn-google {
            width: 100%;
            background: #ffffff;
            color: var(--text-dark);
            padding: 16px;
            border: 2px solid rgba(0,0,0,0.05);
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 15px rgba(0,0,0,0.03);
            margin-bottom: 25px;
        }
        .btn-google:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(161, 140, 209, 0.15);
            border-color: rgba(161, 140, 209, 0.3);
        }
        .btn-google img {
            width: 22px; height: 22px;
        }

        /* OR Divider */
        .divider {
            display: flex; align-items: center; text-align: center; margin-bottom: 25px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 2px dashed rgba(161, 140, 209, 0.2);
        }
        .divider span {
            padding: 0 15px; color: var(--text-muted); font-weight: 800; font-size: 13px; letter-spacing: 1px;
        }

        /* Form Inputs */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; font-size: 14px; padding-left: 5px;}
        .form-control {
            width: 100%; padding: 15px 20px; border-radius: 16px; border: 2px solid rgba(161, 140, 209, 0.2); background: var(--bg-main);
            color: var(--text-dark); font-family: 'Nunito', sans-serif; font-size: 15px; outline: none; transition: var(--transition);
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255, 154, 158, 0.15); background: #ffffff; }
        
        .forgot-password {
            display: block; text-align: right; color: var(--accent); font-size: 13px; font-weight: 700; margin-top: -10px; margin-bottom: 25px; text-decoration: none; transition: var(--transition);
        }
        .forgot-password:hover { color: var(--primary); }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 18px; border: none; border-radius: 20px;
            font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            transition: var(--transition); box-shadow: 0 10px 20px rgba(161, 140, 209, 0.2); cursor: pointer;
        }
        .btn-submit:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(255, 154, 158, 0.4); }

        .auth-footer {
            margin-top: 25px; font-size: 15px; color: var(--text-muted); font-weight: 600;
        }
        .auth-footer a {
            color: var(--primary); font-weight: 800; text-decoration: none; transition: var(--transition);
        }
        .auth-footer a:hover { color: var(--accent); }

        /* --- FOOTER --- */
        footer { background: #ffffff; padding: 30px 5%; text-align: center; border-top: 1px solid rgba(0,0,0,0.03); color: var(--text-muted); font-weight: 600; font-size: 14px; margin-top: auto; }
        footer a { color: var(--accent); text-decoration: none; margin: 0 12px; transition: var(--transition); }
        footer a:hover { color: var(--primary); }

        /* --- ANIMATIONS --- */
        @keyframes breatheCharacter { 0% { transform: scale(1); } 100% { transform: scale(1.04) translateY(-2px); } }
        @keyframes breatheOrb { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 154, 158, 0.4); } 50% { transform: scale(1.15); box-shadow: 0 0 40px rgba(161, 140, 209, 0.6); } }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes floatHero { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px) rotate(5deg); } }
        @keyframes trailStars { 0% { transform: scale(1) rotate(0deg); opacity: 0.8; } 50% { transform: scale(1.4) rotate(180deg); opacity: 0; } 100% { transform: scale(1.1) rotate(360deg); opacity: 0; } }

        /* --- MOBILE ALIGNMENT --- */
        @media (max-width: 850px) {
            header { flex-direction: column; padding: 15px 5%; gap: 12px; }
            nav { width: 100%; }
            nav ul { flex-wrap: wrap; justify-content: center; gap: 10px 20px; }
            main { padding: 40px 5%; }
            .auth-card { padding: 40px 25px; border-radius: 24px; }
            .auth-title { font-size: 28px; }
            .auth-card::before, .auth-card::after { display: none; } /* Hide floating emojis on small screens to prevent overflow */
        }
    </style>
</head>
<body>

    

    <div id="loader">
        <div class="magic-orb"></div>
        <div class="loader-text">Opening the Gates...</div>
    </div>

    <header>
        <div class="logo" onclick="window.location.href='index.html'">Mangakan</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Discover</a></li>
                <li><a href="#">Favorites</a></li>
                <li><a href="creator.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-card">
            <h1 class="auth-title">Welcome <span>Back!</span></h1>
            <p class="auth-subtitle">Sign in to subscribe and save your favorite stories.</p>
            
            <button class="btn-google">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22px" height="22px">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Continue with Gmail
            </button>

            <div class="divider"><span>OR CONTINUE WITH EMAIL</span></div>

            <form id="loginForm" onsubmit="event.preventDefault(); simulateLogin();">
                <div class="form-group">
                    <label for="userEmail">Email Address</label>
                    <input type="email" id="userEmail" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" class="form-control" placeholder="Enter your password" required>
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>

                <button type="submit" class="btn-submit" id="submitBtn">
                    ✨ Sign In
                </button>
            </form>

            <div class="auth-footer">
                New to the realm? <a href="signup.html">Create an Account</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mangakan. Crafted with care by Karash.</p>
        <p style="margin-top: 15px;"><a href="privacy.html">Privacy</a> • <a href="terms.html">Terms</a> • <a href="creator.html">Contact</a></p>
    </footer>

    <script>
     
        // --- LOADING SCREEN ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => { loader.style.visibility = 'hidden'; }, 500); }
            }, 800); 
        });

    // --- REAL LOGIN LOGIC ---
async function simulateLogin() {
    const btn = document.getElementById('submitBtn');
    const email = document.getElementById('userEmail').value;
    const password = document.getElementById('userPassword').value;

    btn.innerHTML = '⏳ Verifying Magic...';
    btn.style.opacity = '0.8';
    btn.style.pointerEvents = 'none';

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
            // Save the token!
            localStorage.setItem('mangakan_token', data.token);
            
            btn.innerHTML = '✨ Success! Redirecting...';
            btn.style.background = 'var(--text-dark)';
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
            alert("Error: " + data.message);
            btn.innerHTML = '✨ Sign In';
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'all';
        }
    } catch (err) {
        console.error(err);
        alert("Server is sleeping! Try again later.");
    }
}
    </script>
</body>
</html>
